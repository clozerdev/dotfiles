[env]
TERM = "xterm-256color"

[font]
size = 12
offset = { x = 1, y = -2 }
glyph_offset = { x = 1, y = -1 }
normal = { family = "BerkeleyMono Nerd Font Mono", style = "Regular" }

[mouse]
hide_when_typing = false

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_timeout = 0
blink_interval = 300

[window]
padding = { x = 0, y = 0 }

[general]
import = ["kanagawa.toml"]
live_config_reload = true
