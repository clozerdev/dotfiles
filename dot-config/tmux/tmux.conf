set-option -ga terminal-overrides ",xterm-256color:Tc"

# General options
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi

# Prefix: Ctrl-A
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -s escape-time 0

# Theme options
set -g @minimal-tmux-right false
set -g @minimal-tmux-indicator false

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse
set -g mouse off

# Options
set-option -g allow-rename off

# Design tweaks
set -g visual-bell off
set -g bell-action none
set -g visual-activity off
set -g visual-silence off
setw -g monitor-activity off

# Clock mode
setw -g clock-mode-colour colour248

# Copy mode
setw -g mode-style 'fg=#ded6c9 bg=#3f3a34 bold'

# Panes
set -g pane-border-style 'fg=#37332e'
set -g pane-active-border-style 'fg=#7a7166'

# Statusbar
set -g status on
set -g status-style 'fg=#8f8678 bg=#1c1b1a'
set -g status-justify centre
set -g status-position bottom
set -g status-left ''
set -g status-right ''

# Windows
setw -g window-status-separator ''
setw -g window-status-style 'fg=#8f8678 bg=#1c1b1a'
setw -g window-status-current-style 'fg=#ded6c9 bg=#3f3a34 bold'

setw -g window-status-format ' #I · #W#{?window_flags, #F,} '
setw -g window-status-current-format ' #I · #W#{?window_flags, #F,} '

# Messages
set -g message-style 'fg=#ded6c9 bg=#3f3a34 bold'
setw -g window-status-bell-style 'fg=#ded6c9 bg=#4a3633 bold'

# Reload config file
bind r source-file $HOME/.config/tmux/tmux.conf
