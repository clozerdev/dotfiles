[module/workspaces]
type = internal/i3

index-sort = true
pin-workspaces = true

label-focused = "%index%"
label-focused-foreground = ${colors.foreground}
label-focused-padding = 1

label-occupied = "%index%"
label-occupied-foreground = ${colors.disabled}
label-occupied-padding = 1

label-unfocused = "%index%"
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 1

label-visible = "%index%"
label-visible-padding = 1

label-urgent = "%name%"
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-mode-foreground = ${colors.foreground}
label-mode-background = ${colors.alert}
label-mode-padding = 1

[module/cpu]
type = internal/cpu
interval = 2

label = " %percentage%%"
label-foreground = ${colors.foreground}

format = <label>
format-padding = 1

format-prefix = 
format-prefix-foreground = ${colors.cyan}
format-prefix-font = 2

[module/memory]
type = internal/memory
interval = 2

label = " %gb_used%"

format = <label>
format-padding = 1

format-prefix = 
format-prefix-foreground = ${colors.lavender}
format-prefix-font = 2

[module/temp]
type = internal/temperature
interval = 2

thermal-zone = 1
warn-temperature = 75

label = " %temperature-c%"
label-foreground = ${colors.foreground}

format = <label>
format-padding = 1

format-prefix = 󱃃
format-prefix-foreground = ${colors.blue}
format-prefix-font = 3

label-warn = " %temperature-c%"
label-warn-foreground = ${colors.alert}

format-warn = <label-warn>
format-warn-padding = 1

format-warn-prefix = 󰔏
format-warn-prefix-foreground = ${colors.alert}
format-warn-prefix-font = 3

[module/volume]
type = internal/pulseaudio

sink = 
use-ui-max = false

interval = 5

label-volume = %percentage%%

format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1

label-muted = " Muted"

format-muted = <label-muted>
format-muted-padding = 1
format-muted-font = 2
format-muted-foreground = ${colors.red}
format-muted-prefix = 

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 
ramp-volume-foreground = ${colors.lavender}
ramp-volume-font = 2

[module/filesystem]
type = internal/fs

interval = 30
fixed-values = true

label-mounted = " %free%"

format-mounted = <label-mounted>
format-mounted-padding = 1

format-mounted-prefix = 
format-mounted-prefix-font = 2
format-mounted-prefix-foreground = ${colors.purple}

[module/battery]
type = internal/battery
poll-interval = 5

low-at = 20
full-at = 99

adapter = ${env:POLYBAR_BATTERY_ADP}
battery = ${env:POLYBAR_BATTERY_BAT}

label-low = " %percentage%%"
label-full = " Full"
label-charging = %percentage%%
label-discharging = %percentage%%

format-low = <label-low>
format-low-prefix = 󱉞
format-low-foreground = ${colors.alert}
format-low-prefix-font = 2
format-low-padding = 1

format-full = <label-full>
format-full-prefix = 
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.green}
format-full-padding = 1

format-charging = <animation-charging> <label-charging>
format-charging-padding = 1

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 1

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 2
ramp-capacity-foreground = ${colors.cyan}

animation-charging-0 = 󱊤
animation-charging-1 = 󱊥
animation-charging-2 = 󱊦
animation-charging-font = 2
animation-charging-foreground = ${colors.primary}

animation-charging-framerate = 750

[module/brightness]
type = internal/backlight

card = amdgpu_bl0

label = %percentage%%

format = <ramp> <label>
format-padding = 1

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃝
ramp-3 = 󰃠
ramp-font = 2
ramp-foreground = ${colors.yellow}

[module/date]
type = internal/date
interval = 1.0

time = " %I:%M %p"
time-alt = " %a, %d %b %Y %I:%M %p"

label = %time%

format = <label>
format-padding = 1

format-prefix = 
format-prefix-foreground = ${colors.blue}
format-prefix-font = 2

[module/network]
type = internal/network
interface = ${env:POLYBAR_WIRELESS}

interval = 1

accumulate-stats = true

label-connected = " %local_ip%"
label-disconnected = " Offline"

format-connected = <label-connected>
format-connected-padding = 1

format-disconnected = <label-disconnected>
format-disconnected-padding = 1

[module/wired-network]
inherit = module/network
interface = ${env:POLYBAR_ETHERNET}

format-connected-prefix = 󱘖
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.orange}

format-disconnected-prefix = 󱘖
format-disconnected-prefix-font = 2
format-disconnected-foreground = ${colors.alert}

[module/wireless-network]
inherit = module/network
interface = ${env:POLYBAR_WIRELESS}

format-connected-prefix = 󰖩
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${colors.orange}

format-disconnected-prefix = 󰖪
format-disconnected-prefix-font = 2
format-disconnected-prefix-foreground = ${colors.alert}

[module/sep]
type = custom/text

format = ·
format-background = ${colors.background}
format-foreground = ${colors.disabled}
format-padding = 1
format-font = 2

[module/tray]
type = internal/tray

format = <tray>
format-padding = 1

tray-size = 12
tray-padding = 2
